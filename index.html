<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#0a5ea8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ATPL過去問"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>ATPL 過去問ドリル</title>
<style>
html{-webkit-tap-highlight-color:transparent}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  --bg:#f1f4f7; --surface:#ffffff; --ink:#132030; --muted:#5a6a7a; --line:#d8dfe6; --soft:#e7edf2;
  --accent:#0a5ea8; --accent-ink:#ffffff; --accent-soft:#dcebf8;
  --ok:#17825a; --ok-soft:#dff3ea; --ng:#c23b3b; --ng-soft:#fbe4e2; --warn:#a86b00; --warn-soft:#fbefd5;
  --img-filter:none;
  --font:'IBM Plex Sans JP','Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d141b; --surface:#151f29; --ink:#e5ecf2; --muted:#8fa1b3; --line:#27353f; --soft:#1e2b36;
    --accent:#5cb0f2; --accent-ink:#06121c; --accent-soft:#17324a;
    --ok:#4cc48c; --ok-soft:#153a2b; --ng:#f2786f; --ng-soft:#432022; --warn:#e3a94a; --warn-soft:#3b2d12;
    --img-filter:invert(.9) hue-rotate(180deg);
  }
}
:root[data-theme="dark"]{
  --bg:#0d141b; --surface:#151f29; --ink:#e5ecf2; --muted:#8fa1b3; --line:#27353f; --soft:#1e2b36;
  --accent:#5cb0f2; --accent-ink:#06121c; --accent-soft:#17324a;
  --ok:#4cc48c; --ok-soft:#153a2b; --ng:#f2786f; --ng-soft:#432022; --warn:#e3a94a; --warn-soft:#3b2d12;
  --img-filter:invert(.9) hue-rotate(180deg);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 132px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px}
.top>div:first-child{flex:1 1 100%}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:26px;line-height:1.25;font-weight:600;margin-top:2px;word-break:keep-all}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.roundchip{font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;white-space:nowrap}
select.roundchip{appearance:none;padding-right:12px}

.strip{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 0 18px;border-block:1px solid var(--line)}
.strip div{padding:12px 0 12px 14px;border-left:1px solid var(--line)}
.strip div:first-child{border-left:0;padding-left:0}
.strip b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.2}
.strip span{font-size:12px;color:var(--muted)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.btn{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.btn small{font-family:var(--mono);font-size:12px;opacity:.85}

.sec{font-size:13px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.subj{padding:16px 0;border-top:1px solid var(--line)}
.subj:last-child{border-bottom:1px solid var(--line)}
.subj-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.subj-head h3{font-size:18px;font-weight:600}
.subj-head .meta{font-size:13px;color:var(--muted);font-family:var(--mono)}
.bar{position:relative;height:8px;background:var(--soft);border-radius:4px;margin:10px 0 6px;overflow:visible}
.bar i{position:absolute;left:0;top:0;height:100%;border-radius:4px;display:block}
.bar .a{background:var(--accent-soft)}
.bar .c{background:var(--ok)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;text-decoration:none}
.barnote{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--mono)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.trio .btn{min-height:44px;font-size:14px;padding:8px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:12px 8px;font-size:14px;color:var(--muted);font-weight:500;min-height:52px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::after{content:"";display:block;height:2px;width:28px;background:var(--accent);margin:4px auto -6px;border-radius:2px}

/* quiz */
.qtop{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4;margin-inline:-16px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.qbar{display:flex;align-items:center;gap:10px}
.qbar .back{border:0;background:none;padding:6px 8px 6px 0;color:var(--muted);font-size:14px;min-height:40px}
.qbar .ttl{flex:1;font-weight:600;font-size:15px;line-height:1.3}
.qbar .cnt{font-family:var(--mono);font-size:13px;color:var(--muted)}
.prog{height:3px;background:var(--soft);border-radius:2px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.code{font-family:var(--mono);font-size:12px;color:var(--muted);margin:18px 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;background:var(--surface)}
.pill.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stem p{margin:0 0 .5em}
.stem p.stmt{padding-left:1.6em;text-indent:-1.6em}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.star[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 14px 4px;margin:10px 0;font-size:14px;line-height:1.65}
.panel dl{margin:0}
.panel dt{font-weight:600;font-size:13px;color:var(--muted)}
.panel dd{margin:0 0 10px}
.panel .lead{margin:0 0 12px}
.fig{margin:12px 0;border:1px solid var(--line);border-radius:10px;overflow:auto;background:#fff}
.fig img{display:block;width:100%;height:auto;filter:var(--img-filter);background:#fff}
.choices{display:grid;gap:10px;margin:18px 0}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:52px;line-height:1.55}
.choice .n{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:13px;margin-top:1px}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ok .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.choice.ng{border-color:var(--ng);background:var(--ng-soft)}
.choice.ng .n{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.choice.dim{opacity:.6}
.result{display:flex;align-items:center;gap:10px;font-weight:600;margin:6px 0 10px}
.result.ok{color:var(--ok)} .result.ng{color:var(--ng)}
.explain{border-top:2px solid var(--line);padding-top:14px;margin-top:8px}
.explain h3{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.explain p{margin:0 0 .6em;font-size:15px}
.disc{font-size:12px;color:var(--muted);margin-top:10px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.dock .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px}

/* results / stats */
.score{display:flex;align-items:baseline;gap:12px;margin:18px 0 4px}
.score b{font-family:var(--mono);font-size:56px;font-weight:500;line-height:1}
.score span{font-size:20px;color:var(--muted);font-family:var(--mono)}
.verdict{display:inline-block;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:600}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--warn-soft);color:var(--warn)}
.rows{margin:18px 0}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:1px solid var(--line)}
.row .m{flex:none;width:22px;text-align:center;font-family:var(--mono);font-weight:600}
.row .m.ok{color:var(--ok)} .row .m.ng{color:var(--ng)} .row .m.sk{color:var(--muted)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hist .row .t{white-space:normal}
.tbl{overflow-x:auto}
.note{font-size:13px;color:var(--muted);margin:10px 0}
.danger{color:var(--ng);border-color:var(--ng)}

/* viewer */
.viewer{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.viewer header{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.viewer header .chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.viewer .body{flex:1;overflow:auto;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.viewer .body img{display:block;background:#fff;filter:var(--img-filter);max-width:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.choice{transition:background .12s,border-color .12s}}
@media (min-width:600px){h1{font-size:30px}}
</style>

</head><body>
<div id="app"></div>
<script src="data-index.js"></script>
<script>
(function(){
"use strict";
var INDEX = window.ATPL_INDEX;   /* [{id,name,short,n}] 新しい順 */
var ROUNDS = {};                 /* 読み込み済みの回 */
var ALLID = 'ALL';
var LS_KEY = 'atpl-drill-v1';
var progress = {v:1, q:{}, hist:[]};
var store = {ref:null, mode:'pending', err:false};
var S = {bk:null, tab:'home', screen:'home', round:INDEX[0].id, loading:true, sess:null, viewer:null, showImg:{}, preOpen:null};
var $app = document.getElementById('app');

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmt(s){ return esc(s).replace(/_\{([^}]*)\}/g,'<sub>$1</sub>').replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/C_D/g,'C<sub>D</sub>'); }
function meta(id){ return INDEX.filter(function(x){return x.id===id})[0]; }
function lookup(r){
  var rd = ROUNDS[r];
  if(!rd._m){ rd._m = {}; rd.subjects.forEach(function(s){ s.q.forEach(function(q){ rd._m[s.id+':'+q.no] = {q:q, s:s}; }); }); }
  return rd._m;
}
function QS(it){ return lookup(it.r)[it.sid+':'+it.no]; }
function pOf(it){ return progress.q[it.k] || null; }
/* 出題範囲: 1つの回、または全期間（重複除く）。項目 = {r:回, sid:科目, no:問番号, k:記録キー} */
var scopeCache = {};
function buildScope(id){
  var subs = {}, rounds = id===ALLID ? INDEX.map(function(x){return ROUNDS[x.id];}) : [ROUNDS[id]];
  rounds.forEach(function(rd){
    rd.subjects.forEach(function(s){
      var o = subs[s.id]; if(!o) o = subs[s.id] = {id:s.id, name:s.name, pts:s.pts, items:[]};
      s.q.forEach(function(q){
        if(id===ALLID && q.d) return;
        o.items.push({r:rd.id, sid:s.id, no:q.no, k:q.d || (rd.id+':'+s.id+':'+q.no)});
      });
    });
  });
  return ['P1','P4','P5','P6','P9'].filter(function(k){return subs[k];}).map(function(k){ var o=subs[k]; o.n=o.items.length; return o; });
}
function scope(){ if(!scopeCache[S.round]) scopeCache[S.round] = buildScope(S.round); return scopeCache[S.round]; }
function loadRound(id, cb){
  if(ROUNDS[id]){ cb(true); return; }
  var s = document.createElement('script'); s.src = 'data-'+id+'.js';
  s.onload = function(){ var d = (window.ATPL_R||{})[id]; if(d){ ROUNDS[id] = d; cb(true); } else cb(false); };
  s.onerror = function(){ cb(false); };
  document.head.appendChild(s);
}
function loadAll(cb){
  var i = 0;
  (function step(){ if(i>=INDEX.length){ cb(true); return; } loadRound(INDEX[i++].id, function(ok){ if(ok) step(); else cb(false); }); })();
}
function needsReview(p){ return !!p && (p.ok===0 || p.s===1); }

/* ---------- storage ---------- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function mergeP(a,b){
  var out = {v:1, q:{}, hist:[]}; a = a||{}; b = b||{};
  [a.q||{}, b.q||{}].forEach(function(m){
    Object.keys(m).forEach(function(k){
      var cur = out.q[k], nx = m[k];
      if(!cur || (nx.t||0) >= (cur.t||0)) out.q[k] = nx;
    });
  });
  var seen = {};
  (a.hist||[]).concat(b.hist||[]).forEach(function(h){ if(!seen[h.id]){ seen[h.id]=1; out.hist.push(h); } });
  out.hist.sort(function(x,y){return y.id-x.id}); out.hist = out.hist.slice(0,60);
  return out;
}
function loadLocal(){ try{ var j = localStorage.getItem(LS_KEY); if(j) return JSON.parse(j); }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(progress)); }catch(e){} }
var saving=false, again=false, timer=null;
function touch(){ saveLocal(); clearTimeout(timer); timer = setTimeout(flush, 700); }
function flush(){
  if(!store.ref) return;
  if(saving){ again = true; return; }
  saving = true;
  var body = clone(progress); body.u = Date.now();
  store.ref.set(body).then(function(){ store.err=false; }, function(){ store.err=true; }).then(function(){
    saving=false; if(again){ again=false; flush(); } else if(S.screen==='home'||S.tab==='stats') paintSaveState();
  });
}
function paintSaveState(){ var el=document.getElementById('savestate'); if(el) el.textContent = saveText(); }
function saveText(){
  if(store.mode==='cloud') return store.err ? '同期に失敗（この端末には保存済み）' : '記録はアカウントに保存されます';
  if(store.mode==='local') return '記録はこの端末に保存されます（別の端末とは共有されません）。ときどき「成績」画面でバックアップしてください';
  return '保存先を確認中…';
}
function initStore(){
  var local = loadLocal(); if(local) progress = mergeP(progress, local);
  var c = null;
  if(!c || !c.use){ store.mode='local'; render(); return; }
  Promise.all([c.use('db'), c.use('user')]).then(function(r){
    var db=r[0], user=r[1];
    if(!db || !user) return null;
    return Promise.resolve(user.id()).then(function(uid){
      if(!uid) return null;
      store.ref = db.doc('data/users/'+uid+'/progress');
      return store.ref.get().then(function(snap){
        if(snap.exists) progress = mergeP(progress, clone(snap.data()));
        store.mode='cloud'; touch();
      });
    });
  }).catch(function(){ store.ref=null; }).then(function(){
    if(store.mode!=='cloud') store.mode='local';
    if(!S.sess) render(); else paintSaveState();
  });
}

/* ---------- offline status ---------- */
var OFF = {text:'オフライン用の保存を確認中…'};
function setOff(t){ OFF.text = t; var el = document.getElementById('offstate'); if(el) el.textContent = t; }
function checkOffline(){
  if(!('serviceWorker' in navigator) || !window.caches){ setOff('このブラウザではオフライン保存を使えません'); return; }
  var tries = 0;
  (function poll(){
    caches.match('data-H31-03.js').then(function(r){
      if(r){ setOff('オフラインで使えます（保存済み）'); }
      else if(++tries < 20) setTimeout(poll, 1500);
      else setOff('オフライン用の保存が完了していません。ページを開き直してください');
    }, function(){ setOff('オフライン用の保存を確認できません'); });
  })();
}
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); checkOffline(); }); }
else { OFF.text = 'このブラウザではオフライン保存を使えません'; }

/* ---------- progress ops ---------- */
function record(it,ok){
  var p = progress.q[it.k] || {a:0,c:0,w:0,ok:null,s:0,t:0};
  p.a++; if(ok) p.c++; else p.w++;
  p.ok = ok?1:0; p.t = Date.now(); progress.q[it.k] = p; touch();
}
function toggleStar(it){
  var p = progress.q[it.k] || {a:0,c:0,w:0,ok:null,s:0,t:0};
  p.s = p.s ? 0 : 1; p.t = Date.now(); progress.q[it.k] = p; touch();
}
function subjStats(s){
  var ans=0, ok=0, rev=0;
  s.items.forEach(function(it){
    var p = pOf(it);
    if(p && p.a>0){ ans++; if(p.ok===1) ok++; }
    if(needsReview(p)) rev++;
  });
  return {ans:ans, ok:ok, rev:rev, n:s.n};
}
function totals(){
  var t = {ans:0, ok:0, rev:0, n:0};
  scope().forEach(function(s){ var x = subjStats(s); t.ans+=x.ans; t.ok+=x.ok; t.rev+=x.rev; t.n+=x.n; });
  return t;
}
function pct(a,b){ return b ? Math.round(a*100/b) : 0; }

/* ---------- sessions ---------- */
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pool(sid, kind){
  var list = [];
  scope().forEach(function(s){
    if(sid && s.id!==sid) return;
    s.items.forEach(function(it){
      if(kind==='wrong' && !needsReview(pOf(it))) return;
      list.push(it);
    });
  });
  return kind==='seq' ? list : shuffle(list);
}
function start(sid, kind){
  if(S.loading) return;
  var list = pool(sid, kind);
  if(!list.length){ toast('復習する問題はまだありません'); return; }
  S.sess = {sid:sid, kind:kind, list:list, idx:0, done:{}, id:Date.now()};
  S.screen = 'quiz'; S.showImg = {}; S.preOpen = null; S.viewer = null;
  render(); window.scrollTo(0,0);
}
function cur(){ var e = S.sess.list[S.sess.idx], x = QS(e); return {ref:e, q:x.q, s:x.s}; }
function choose(i){
  var se = S.sess; if(se.done[se.idx]) return;
  var c = cur(), ok = (c.q.ans===0) || (i === c.q.ans) || !!(c.q.alt && c.q.alt.indexOf(i)>=0);
  se.done[se.idx] = {pick:i, ok:ok};
  record(c.ref, ok);
  render();
  requestAnimationFrame(function(){ var el = document.querySelector('.result'); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); });
}
function next(){
  var se = S.sess;
  if(se.idx < se.list.length-1){ se.idx++; S.preOpen=null; render(); window.scrollTo(0,0); }
  else finish();
}
function prev(){ var se=S.sess; if(se.idx>0){ se.idx--; S.preOpen=null; render(); window.scrollTo(0,0);} }
function finish(){
  var se = S.sess, n = se.list.length, c = 0, a = 0;
  Object.keys(se.done).forEach(function(k){ a++; if(se.done[k].ok) c++; });
  if(a>0 && !se.saved){
    se.saved = true;

var toastEl=null, toastT=null;
function toast(msg){
  if(toastEl) toastEl.remove();
  toastEl = document.createElement('div'); toastEl.className='toast'; toastEl.setAttribute('role','status'); toastEl.textContent = msg;
  document.body.appendChild(toastEl); clearTimeout(toastT); toastT = setTimeout(function(){ if(toastEl){toastEl.remove(); toastEl=null;} }, 2400);
}

/* ---------- round switching ---------- */
function ensureLoaded(id, done){
  var ready = id===ALLID ? INDEX.every(function(x){return ROUNDS[x.id];}) : !!ROUNDS[id];
  if(ready){ done(true); return; }
  S.loading = true; render();
  (id===ALLID ? loadAll : function(cb){ loadRound(id, cb); })(function(ok){ S.loading = false; done(ok); });
}
function switchRound(id){
  var prevR = S.round;
  S.round = id;
  ensureLoaded(id, function(ok){
    if(!ok){ S.round = prevR; toast('読み込めませんでした。オフラインの場合は、一度オンラインで開いてください'); }
    else { try{ localStorage.setItem('atpl-drill-round', S.round); }catch(x){} }
    render();
  });
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  var a = b.getAttribute('data-act');
  if(a==='start') start(b.getAttribute('data-sid')||null, b.getAttribute('data-kind'));
  else if(a==='tab'){ S.tab = b.getAttribute('data-tab'); render(); window.scrollTo(0,0); }
  else if(a==='choose') choose(parseInt(b.getAttribute('data-i'),10));
  else if(a==='next') next();
  else if(a==='prev') prev();
  else if(a==='exit') exitQuiz();
  else if(a==='home'){ S.screen='home'; S.sess=null; render(); window.scrollTo(0,0); }
  else if(a==='retry'){
    var se = S.sess, list = se.list.filter(function(x,i){ return se.done[i] && !se.done[i].ok; });
    S.sess = {sid:se.sid, kind:'wrong', list:shuffle(list), idx:0, done:{}, id:Date.now()};
    S.screen='quiz'; S.showImg={}; S.preOpen=null; render(); window.scrollTo(0,0);
  }
  else if(a==='img'){ var c=cur(), k=c.ref.k; var was=(k in S.showImg)?S.showImg[k]:!!c.q.fig; S.showImg[k]=!was; render(); }
  else if(a==='star'){ toggleStar(cur().ref); render(); }
  else if(a==='pre'){ var cu = S.preOpen===null ? (cur().ref.no===16) : S.preOpen; S.preOpen = !cu; render(); }
  else if(a==='preimg'){ S.viewer = {list:[{name:'飛行計画の条件（原文）', img:ROUNDS[cur().ref.r].pre.img}], i:0, zoom:false}; render(); }
  else if(a==='att'){ S.viewer = {list:ROUNDS[cur().ref.r].att, i:0, zoom:false}; render(); }
  else if(a==='vsel'){ S.viewer.i = parseInt(b.getAttribute('data-i'),10); render(); }
  else if(a==='vzoom'){ S.viewer.zoom = !S.viewer.zoom; render(); }
  else if(a==='vclose'){ S.viewer = null; render(); }
  else if(a==='bk-export'){ S.bk = {mode:'export', text:JSON.stringify(progress)}; render(); }
  else if(a==='bk-import'){ S.bk = {mode:'import', text:''}; render(); }
  else if(a==='bk-close'){ S.bk = null; render(); }
  else if(a==='bk-copy'){
    var ta = document.getElementById('bkText'); ta.focus(); ta.select();
    var ok = false; try{ ok = document.execCommand('copy'); }catch(x){}
    if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(function(){ toast('コピーしました'); }, function(){ toast('文字列を長押ししてコピーしてください'); }); }
    else toast(ok ? 'コピーしました' : '文字列を長押ししてコピーしてください');
  }
  else if(a==='bk-do'){
    var v = (document.getElementById('bkText').value||'').trim();
    try{ var o = JSON.parse(v); if(!o || typeof o!=='object' || !o.q) throw 0; progress = mergeP(progress, o); touch(); S.bk = null; render(); toast('記録を読み込みました'); }
    catch(x){ toast('読み込めませんでした。文字列をすべて貼り付けてください'); }
  }
  else if(a==='reset'){
    if(window.confirm('回答の記録と履歴をすべて消します。よろしいですか？')){
      progress = {v:1, q:{}, hist:[]}; try{ localStorage.removeItem(LS_KEY);}catch(x){}
      if(store.ref){ store.ref.set({v:1,q:{},hist:[],u:Date.now()}).catch(function(){}); }
      render(); toast('成績をリセットしました');
    }
  }
});
document.addEventListener('change', function(e){
  if(e.target && e.target.id==='roundSel'){ switchRound(e.target.value); }
});
document.addEventListener('keydown', function(e){
  if(S.screen!=='quiz' || S.viewer) return;
  var tag = (e.target && e.target.tagName)||'';
  if(tag==='SELECT' || tag==='INPUT') return;
  var se = S.sess, dn = se.done[se.idx];
  if(tag==='BUTTON' && (e.key==='Enter' || e.key===' ')) return;
  if(/^[1-5]$/.test(e.key) && !dn){ var c = cur(); if(parseInt(e.key,10) <= c.q.choices.length) choose(parseInt(e.key,10)); }
  else if((e.key==='Enter' || e.key==='ArrowRight') && dn){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'){ prev(); }
});

(function boot(){
  var saved = null; try{ saved = localStorage.getItem('atpl-drill-round'); }catch(x){}
  if(saved && (saved===ALLID || INDEX.some(function(x){return x.id===saved;}))) S.round = saved;
  ensureLoaded(S.round, function(ok){
    if(!ok && S.round!==INDEX[0].id){ S.round = INDEX[0].id; ensureLoaded(S.round, function(){ render(); }); return; }
    if(!ok) toast('問題データを読み込めませんでした');
    render();
  });
})();
initStore();
})();
</script>
